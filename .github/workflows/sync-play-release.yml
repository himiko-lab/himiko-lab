name: Sinkron rilis Google Play

# Setiap hari memeriksa rilis Morvyn yang tayang di jalur produksi Google
# Play. Kalau ada versi baru, nomor versi dan teks "Yang baru"-nya (ID dan EN)
# ditambahkan ke src/data/releases.json, di-commit, lalu situs dideploy
# ulang. Entri itu otomatis menjadi tulisan Kabar baru dan memperbarui versi
# Morvyn di data terstruktur. Bisa juga dijalankan manual dari tab Actions
# lewat "Run workflow".
#
# Butuh secret PLAY_SERVICE_ACCOUNT_JSON: kunci JSON akun layanan Google
# Cloud yang sudah diundang di Play Console. Lihat README, bagian
# "Kabar otomatis dari Google Play".
on:
  schedule:
    # 01.30 UTC = 08.30 WIB, setengah jam sesudah sinkron di morvyn-web.
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  # Meng-commit releases.json.
  contents: write
  # Menjalankan workflow deploy. Push oleh GITHUB_TOKEN sengaja tidak
  # memicu workflow lain, jadi deploy harus dipanggil terang-terangan.
  actions: write
  # Membuka issue pengingat untuk meninjau ringkasan Morvyn.
  issues: write

concurrency:
  group: sync-play-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Skripnya hanya memakai modul bawaan Node, jadi tidak perlu npm install.
      - id: sync
        run: node scripts/sync-play-release.mjs
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Commit releases.json
        if: steps.sync.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/releases.json
          git commit -m "Tambah Kabar Morvyn ${{ steps.sync.outputs.version }} dari Google Play"
          git push

      - name: Deploy ulang situs
        if: steps.sync.outputs.version != ''
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

      # Tulisan Kabar dan nomor versi sudah otomatis, tapi ringkasan fitur dan
      # privasi Morvyn di situs ini berisi klaim tentang aplikasi yang harus
      # ditinjau manusia. Issue ini pengingatnya. Kegagalannya tidak
      # menggagalkan sinkron yang sudah berhasil.
      - name: Buka issue pengingat
        if: steps.sync.outputs.version != ''
        continue-on-error: true
        run: |
          gh issue create \
            --title "Morvyn ${{ steps.sync.outputs.version }} tayang di Play: tinjau ringkasan Morvyn" \
            --body "Tulisan Kabar untuk Morvyn ${{ steps.sync.outputs.version }} (versionCode ${{ steps.sync.outputs.version_code }}) sudah terbit otomatis.

          Yang masih perlu ditinjau dengan tangan:
          - Judul dan ringkasan tulisannya. Judul otomatisnya \"Morvyn ${{ steps.sync.outputs.version }}: catatan rilis\". Untuk menggantinya, tulis \`title\` dan \`summary\` di \`news.posts\` pada src/i18n/id.js dan en.js.
          - Ringkasan delapan menu Morvyn (\`morvyn.features\`) dan teks widget di src/i18n/id.js dan en.js, bila versi ini menambah atau mengubah fitur.
          - Ringkasan privasi (\`morvynPage.privacy\`), bila Kebijakan Privasi Morvyn ikut berubah."
        env:
          GH_TOKEN: ${{ github.token }}
